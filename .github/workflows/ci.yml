name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Same credentials the manual Postgres container below is started with.
  PG_USER: octoforge
  PG_PASSWORD: octoforge
  PG_TEST_DB: octoforge_test

jobs:
  check:
    runs-on: ubuntu-latest
    # The whole job takes ~4 minutes. Without a bound, a deadlocked test runs
    # into the 6-hour runner limit and the result reads "cancelled" — which
    # looks like infrastructure noise rather than a broken build, and hid a
    # real shutdown deadlock for two days. `faulthandler_timeout` dumps the
    # stacks but does not abort, so the bound has to live here.
    timeout-minutes: 20

    # No `services:` block on purpose. The Postgres store tests need pgvector
    # and pg_textsearch, which only the image built from docker/postgres has,
    # and a service container can only pull an image that already exists in a
    # registry — it is started before any step runs, so it cannot use one this
    # job builds. Starting the container by hand is the way to test against the
    # database the deployment actually uses instead of a lookalike.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: make install

      - name: Check (ruff + mypy + pytest, both projects)
        run: make check

      - name: Start Postgres with the search extensions
        run: |
          docker build -t octoforge-postgres:ci ./docker/postgres
          docker run -d --name octoforge-ci-postgres \
            -e POSTGRES_USER="${PG_USER}" \
            -e POSTGRES_PASSWORD="${PG_PASSWORD}" \
            -e POSTGRES_DB="${PG_TEST_DB}" \
            -p 5432:5432 \
            octoforge-postgres:ci \
            -c shared_preload_libraries=pg_textsearch
          for _ in $(seq 1 30); do
            docker exec octoforge-ci-postgres \
              pg_isready -U "${PG_USER}" -d "${PG_TEST_DB}" && break
            sleep 2
          done
          # Fail loudly here rather than as thirty confusing test errors later:
          # without the extensions every Postgres test dies on CREATE EXTENSION.
          found=$(docker exec octoforge-ci-postgres psql -U "${PG_USER}" -d "${PG_TEST_DB}" -tAc \
            "SELECT count(*) FROM pg_available_extensions WHERE name IN ('vector', 'pg_textsearch')")
          test "${found}" = "2" || { echo "search extensions missing from the image (found ${found}/2)"; exit 1; }

      - name: Postgres store tests
        env:
          OF_TEST_DATABASE_URL: postgresql+asyncpg://octoforge:octoforge@127.0.0.1:5432/octoforge_test
        run: cd core && ../.venv/bin/pytest tests/test_postgres_stores.py

      - name: Stop Postgres
        if: always()
        run: docker rm -f octoforge-ci-postgres || true

      # Advisories appear without the code changing, so this is its own step
      # rather than part of `make check`: a red build here means "a dependency
      # needs attention today", not "this commit broke something".
      - name: Dependency vulnerabilities
        run: make audit
