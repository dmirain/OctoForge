[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoforge-telegram"
version = "0.11.1"
description = "OctoForge Telegram surface: ingestion and rendering"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
dependencies = [
    "octoforge-server",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # keep in sync with core's dev extra (see the note there)
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
