<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OctoForge — консоль</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2b3040; --text: #e6e8ef;
    --muted: #8c93a8; --accent: #7aa2f7; --danger: #f7768e; --ok: #9ece6a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7fb; --panel: #fff; --line: #dfe3ee; --text: #1a1d26;
      --muted: #666e85; --accent: #3055b3; --danger: #c03a52; --ok: #3f7d20;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .totals { color: var(--muted); font-size: 12px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; padding: 10px 18px;
    border-bottom: 1px solid var(--line); }
  nav button { background: transparent; color: var(--muted); border: 1px solid transparent;
    border-radius: 7px; padding: 6px 11px; cursor: pointer; font: inherit; }
  nav button:hover { color: var(--text); border-color: var(--line); }
  nav button[aria-current="true"] { color: var(--text); border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent); }
  main { padding: 16px 18px 40px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input, .toolbar select { background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; padding: 6px 9px; font: inherit; }
  td select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 4px; font: inherit; font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .toolbar .spacer { flex: 1; }
  .count { color: var(--muted); font-size: 12px; }
  .scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel); font-weight: 600;
    color: var(--muted); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  td.mono, th.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  td .clip { display: block; max-width: 52ch; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  td.wrap .clip { white-space: pre-wrap; max-width: 70ch; overflow: visible; }
  button.link { background: none; border: none; color: var(--accent); cursor: pointer;
    padding: 0; font: inherit; }
  button.act { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
  button.act.danger { color: var(--danger); }
  .pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .tag { display: inline-block; border: 1px solid var(--line); border-radius: 5px;
    padding: 0 5px; margin-right: 3px; font-size: 11px; color: var(--muted); }
  .yes { color: var(--ok); } .no { color: var(--muted); }
  .err { color: var(--danger); margin-bottom: 10px; }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; max-width: min(900px, 92vw); width: 100%; }
  dialog pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-size: 12px; }
  dialog .close { float: right; }
</style>
</head>
<body>
<header>
  <h1>OctoForge · консоль</h1>
  <span class="totals" id="totals">…</span>
</header>
<nav id="nav"></nav>
<main>
  <div class="err" id="error" hidden></div>
  <div class="toolbar" id="toolbar"></div>
  <div class="scroll"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
  <div class="pager">
    <button class="act" id="prev">← назад</button>
    <button class="act" id="next">вперёд →</button>
    <span class="count" id="range"></span>
  </div>
</main>
<dialog id="viewer"><button class="act close" id="viewer-close">закрыть</button><pre id="viewer-body"></pre></dialog>

<script>
"use strict";

const state = { view: "dialogs", offset: 0, limit: 50, query: "", status: "", dialogId: null,
  datasetId: null, tariffs: [], defaultTariff: null };

const short = (value) => (value === null || value === undefined ? "—" : String(value));
const lim = (value) => (value === null || value === undefined ? "∞" : String(value));
const time = (value) => (value ? String(value).replace("T", " ").slice(0, 19) : "—");
const flag = (value) => `<span class="${value ? "yes" : "no"}">${value ? "да" : "нет"}</span>`;
const tags = (list) => (list && list.length ? list.map((t) => `<span class="tag">${esc(t)}</span>`).join("") : "—");

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function clip(value, cls) {
  return `<td class="${cls || ""}"><span class="clip" title="${esc(value)}">${esc(short(value))}</span></td>`;
}

// Один способ показать человека везде: имя, когда оно известно, иначе id;
// сам id остаётся в тултипе. fallback — подпись для строк без владельца.
function person(id, name, fallback) {
  if (!id) return `<td class="mono">${esc(fallback || "—")}</td>`;
  return `<td class="${name ? "" : "mono"}"><span class="clip" title="${esc(id)}">${esc(name || id)}</span></td>`;
}

function open(text) {
  document.getElementById("viewer-body").textContent = text;
  document.getElementById("viewer").showModal();
}

function statusBadge(status) {
  const label = { active: "активен", waiting: "в очереди", banned: "забанен" }[status] || status;
  return `<span title="${esc(status)}">${esc(label)}</span>`;
}

// Тариф человека — и показ, и смена одним контролом, в его же строке.
// Пустое значение = явной привязки нет; тогда действует дефолтный тариф, и
// именно он назван в подписи: иначе большинство публичной установки выглядело
// бы как «тарифа нет», хотя лимиты к ним применяются.
function tariffPicker(u) {
  const inherited = state.defaultTariff ? `по умолчанию · ${state.defaultTariff}` : "без тарифа · ∞";
  const options = [`<option value="" ${u.tariff_assigned ? "" : "selected"}>${esc(inherited)}</option>`]
    .concat((state.tariffs || []).map((code) =>
      `<option value="${esc(code)}" ${u.tariff_assigned && code === u.tariff ? "selected" : ""}>${esc(code)}</option>`));
  return `<select class="mono" data-assign="${esc(u.user_id)}" ` +
    `title="действует: ${esc(u.tariff || "без тарифа (без ограничений)")}">${options.join("")}</select>`;
}

function userActions(u) {
  const post = (label, status, cls, confirmMsg) =>
    `<button class="act ${cls || ""}" data-post="/api/admin/users/${encodeURIComponent(u.user_id)}/status?status=${status}"` +
    `${confirmMsg ? ` data-confirm="${esc(confirmMsg)}"` : ""}>${label}</button>`;
  if (u.status === "banned") return post("разбанить", "active");
  const ban = post("бан", "banned", "danger", "Забанить? Его cron-задачи встанут на паузу.");
  return (u.status === "waiting" ? post("активировать", "active") + " " : "") + ban;
}

const VIEWS = {
  dialogs: {
    title: "Диалоги", path: () => "/api/admin/dialogs",
    columns: ["пользователь", "канал", "юзер / агент", "за сутки", "задач", "посл. от юзера", "последнее", "создан", ""],
    row: (d) => `${person(d.user_id, d.user_name)}<td>${esc(d.channel)}</td>` +
      `<td>${d.user_message_count} / ${d.agent_message_count}</td>` +
      `<td>${d.user_messages_24h}</td>` +
      `<td>${d.task_count}</td><td class="mono">${time(d.last_user_message_at)}</td>` +
      `<td class="mono">${time(d.last_message_at)}</td>` +
      `<td class="mono">${time(d.created_at)}</td>` +
      `<td><button class="act" data-open-dialog="${esc(d.id)}">сообщения</button> ` +
      `<button class="act danger" data-delete="/api/admin/dialogs/${esc(d.id)}">удалить</button></td>`,
  },
  messages: {
    title: "Сообщения диалога", path: () => `/api/admin/dialogs/${state.dialogId}/messages`,
    columns: ["seq", "роль", "текст", "задача", "токены", "время"],
    row: (m) => `<td>${m.seq}</td><td>${esc(m.role)}</td>` +
      `<td class="wrap"><span class="clip">${esc(m.content)}</span></td>` +
      `${clip(m.task_id, "mono")}<td class="mono">${short(m.prompt_tokens)}/${short(m.completion_tokens)}</td>` +
      `<td class="mono">${time(m.created_at)}</td>`,
  },
  tasks: {
    title: "Задачи", path: () => "/api/admin/tasks",
    filters: ["status"],
    columns: ["title", "вид", "статус", "пользователь", "доставлено", "результат", "создана", ""],
    row: (t) => `${clip(t.title)}<td>${esc(t.kind)}</td><td>${esc(t.status)}</td>` +
      `${person(t.user_id, t.user_name)}<td>${flag(t.delivered_at)}</td>` +
      `<td><button class="link" data-view="${esc(t.result || t.error || "")}">открыть</button></td>` +
      `<td class="mono">${time(t.created_at)}</td>` +
      `<td><button class="act danger" data-delete="/api/admin/tasks/${esc(t.id)}">удалить</button></td>`,
  },
  cron: {
    title: "Cron", path: () => "/api/admin/cron",
    columns: ["title", "расписание", "tz", "вкл", "следующий", "последний", "итог", "пользователь", ""],
    row: (c) => `${clip(c.title)}<td class="mono">${esc(c.schedule)}</td><td>${esc(c.timezone)}</td>` +
      `<td>${flag(c.enabled)}</td><td class="mono">${time(c.next_fire_at)}</td>` +
      `<td class="mono">${time(c.last_fire_at)}</td><td>${esc(short(c.last_status))}</td>` +
      `${person(c.user_id, c.user_name)}` +
      `<td><button class="act" data-post="/api/admin/cron/${esc(c.id)}/enabled?enabled=${!c.enabled}">` +
      `${c.enabled ? "пауза" : "включить"}</button> ` +
      `<button class="act danger" data-delete="/api/admin/cron/${esc(c.id)}">удалить</button></td>`,
  },
  instructions: {
    title: "Инструкции", path: () => "/api/admin/instructions",
    filters: ["query"],
    columns: ["тип", "title", "владелец", "автор", "system", "версия", "теги", "текст", ""],
    row: (i) => `<td>${esc(i.type)}</td>${clip(i.title)}${person(i.owner_id, i.owner_name, "public")}` +
      `${person(i.author_id, i.author_name)}` +
      `<td>${flag(i.system)}</td><td>${i.version}</td><td>${tags(i.tags)}</td>` +
      `<td><button class="link" data-view="${esc(i.content)}">открыть</button></td>` +
      `<td>${i.owner_id ? `<button class="act" data-post="/api/admin/instructions/${esc(i.id)}/publish">опубликовать</button> ` : ""}` +
      `${i.system ? "" : `<button class="act danger" data-delete="/api/admin/instructions/${esc(i.id)}` +
      `${i.owner_id ? `?owner_id=${encodeURIComponent(i.owner_id)}` : ""}">удалить</button>`}</td>`,
  },
  datasets: {
    title: "Датасеты", path: () => "/api/admin/datasets",
    columns: ["name", "владелец", "описание", "поля", "версия", ""],
    row: (d) => `${clip(d.name)}${person(d.owner_user_id, d.owner_name)}${clip(d.description)}` +
      `<td>${tags(d.fields)}</td><td>${d.version}</td>` +
      `<td><button class="act" data-open-dataset="${esc(d.id)}">записи</button></td>`,
  },
  records: {
    title: "Записи датасета", path: () => `/api/admin/datasets/${state.datasetId}/records`,
    columns: ["id", "владелец", "payload", "создана"],
    row: (r) => `${clip(r.id, "mono")}${person(r.owner_user_id, r.owner_name)}` +
      `<td><button class="link" data-view="${esc(JSON.stringify(r.payload, null, 2))}">открыть</button></td>` +
      `<td class="mono">${time(r.created_at)}</td>`,
  },
  memories: {
    title: "Память", path: () => "/api/admin/memories",
    columns: ["key", "владелец", "содержимое", "теги", "обновлена", ""],
    row: (m) => `${clip(m.key)}${person(m.user_id, m.user_name, "global")}${clip(m.content)}` +
      `<td>${tags(m.tags)}</td><td class="mono">${time(m.updated_at)}</td>` +
      `<td><button class="act danger" data-delete="/api/admin/memories/${encodeURIComponent(m.key)}` +
      `${m.user_id ? `?user_id=${encodeURIComponent(m.user_id)}` : ""}">удалить</button></td>`,
  },
  summaries: {
    title: "Сводки", path: () => "/api/admin/summaries",
    columns: ["dialog_id", "seq", "темы", "текст", "создана"],
    row: (s) => `${clip(s.dialog_id, "mono")}<td class="mono">${s.seq_from}–${s.seq_to}</td>` +
      `<td>${tags(s.topics)}</td>` +
      `<td><button class="link" data-view="${esc(s.content)}">открыть</button></td>` +
      `<td class="mono">${time(s.created_at)}</td>`,
  },
  users: {
    title: "Пользователи", path: () => "/api/admin/users",
    absorb: (page) => { state.tariffs = page.tariffs; state.defaultTariff = page.default_tariff; },
    columns: ["имя", "статус", "тариф", "поверхности", "создан", ""],
    row: (u) => `${person(u.user_id, u.name || u.email)}` +
      `<td>${statusBadge(u.status)}</td>` +
      `<td>${tariffPicker(u)}</td>` +
      `<td>${tags(u.identities.map((i) => i.surface + ":" + (i.username ? "@" + i.username : i.external_id) + (i.active ? "" : " ✕")))}</td>` +
      `<td class="mono">${time(u.created_at)}</td>` +
      `<td>${userActions(u)}</td>`,
  },
  tgusers: {
    title: "Telegram", path: () => "/api/admin/telegram/users",
    columns: ["имя", "username", "user_id", "инвайт", "кто привёл", "впервые", "последний раз"],
    row: (u) => `${clip([u.first_name, u.last_name].filter(Boolean).join(" ") || "—")}` +
      `<td class="mono">${u.username ? "@" + esc(u.username) : "—"}</td>` +
      `${clip(u.user_id, "mono")}` +
      `<td class="mono">${u.invite_code ? esc(u.invite_code) + (u.invite_note ? " · " + esc(u.invite_note) : "") + " (" + esc(u.invite_status) + ")" : "—"}</td>` +
      `${clip(u.referred_by || "—")}` +
      `<td class="mono">${time(u.first_seen_at)}</td>` +
      `<td class="mono">${time(u.last_seen_at)}</td>`,
  },
  params: {
    title: "Параметры", path: () => "/api/admin/params",
    columns: ["пользователь", "код", "значение", "обновлён", ""],
    row: (p) => `${person(p.user_id, p.user_name)}<td class="mono">${esc(p.code)}</td>` +
      `${clip(p.value)}<td class="mono">${time(p.updated_at)}</td>` +
      `<td><button class="act danger" data-delete="/api/admin/params/${encodeURIComponent(p.code)}` +
      `?user_id=${encodeURIComponent(p.user_id)}">удалить</button></td>`,
  },
  secrets: {
    title: "Секреты", path: () => "/api/admin/secrets",
    columns: ["пользователь", "код", "хост", "описание", "куда", "преобразование", "использован"],
    row: (s) => `${person(s.user_id, s.user_name)}<td class="mono">${esc(s.code)}</td>` +
      `<td class="mono">${esc(s.allowed_host)}</td>${clip(s.description)}` +
      `<td>${tags(s.placements)}</td><td>${esc(short(s.transform))}</td>` +
      `<td class="mono">${time(s.last_used_at)}</td>`,
  },
  tariffs: {
    title: "Тарифы", path: () => "/api/admin/tariffs",
    columns: ["код", "название", "дефолт", "функции", "токены/д", "сообщ./д", "ответы/д", "cron", "датасеты", "память", "пользователи", ""],
    row: (t) => `<td class="mono">${esc(t.code)}</td>${clip(t.title)}` +
      `<td>${t.is_default ? "✓" : ""}</td><td>${tags(t.features)}</td>` +
      `<td class="mono">${lim(t.daily_tokens)}</td><td class="mono">${lim(t.daily_user_messages)}</td>` +
      `<td class="mono">${lim(t.daily_assistant_messages)}</td><td class="mono">${lim(t.max_cron_jobs)}</td>` +
      `<td class="mono">${lim(t.max_datasets)}</td><td class="mono">${lim(t.max_memory_chars)}</td><td>${tags(t.users)}</td>` +
      `<td><button class="act danger" data-delete="/api/admin/tariffs/${encodeURIComponent(t.code)}">удалить</button></td>`,
  },
  usage: {
    title: "Потребление (30 дней)", path: () => "/api/admin/usage",
    columns: ["пользователь", "вид", "источник", "prompt", "completion", "кол-во", "событий"],
    row: (u) => `${person(u.user_id, u.user_name)}<td>${esc(u.kind)}</td><td>${esc(u.origin)}</td>` +
      `<td class="mono">${u.prompt_tokens}</td><td class="mono">${u.completion_tokens}</td>` +
      `<td class="mono">${u.quantity}</td><td class="mono">${u.events}</td>`,
  },
  usageevents: {
    title: "Журнал потребления", path: () => "/api/admin/usage/events",
    columns: ["пользователь", "вид", "источник", "prompt", "completion", "кол-во", "dialog", "task", "время"],
    row: (u) => `${person(u.user_id, u.user_name)}<td>${esc(u.kind)}</td><td>${esc(u.origin)}</td>` +
      `<td class="mono">${u.prompt_tokens}</td><td class="mono">${u.completion_tokens}</td>` +
      `<td class="mono">${u.quantity}</td>${clip(u.dialog_id, "mono")}${clip(u.task_id, "mono")}` +
      `<td class="mono">${time(u.created_at)}</td>`,
  },
  exchanges: {
    title: "Обмены", path: () => "/api/admin/exchanges",
    filters: ["status"],
    statusOptions: ["", "collecting", "open", "in_progress", "awaiting_user", "answered",
      "cancelled", "failed"],
    columns: ["пользователь", "title", "статус", "вопрос", "обновлён"],
    row: (e) => `${person(e.user_id, e.user_name)}${clip(e.title)}<td>${esc(e.status)}</td>` +
      `${clip(e.pending_question)}` +
      `<td class="mono">${time(e.updated_at)}</td>`,
  },
};

const NAV = [
  ["dialogs", "Диалоги"], ["users", "Пользователи"], ["tgusers", "Telegram"], ["exchanges", "Обмены"],
  ["tasks", "Задачи"], ["cron", "Cron"],
  ["instructions", "Инструкции"], ["datasets", "Датасеты"], ["memories", "Память"],
  ["params", "Параметры"], ["secrets", "Секреты"], ["summaries", "Сводки"],
  ["tariffs", "Тарифы"], ["usage", "Потребление"],
];

function renderNav() {
  document.getElementById("nav").innerHTML = NAV
    .map(([key, label]) => `<button data-nav="${key}" aria-current="${key === state.view}">${label}</button>`)
    .join("");
}

function renderToolbar(view) {
  const parts = [];
  if (state.view === "messages") parts.push(`<button class="act" data-nav="dialogs">← к диалогам</button>`);
  if (state.view === "records") parts.push(`<button class="act" data-nav="datasets">← к датасетам</button>`);
  if (view.filters?.includes("query")) {
    parts.push(`<input id="f-query" placeholder="поиск по title" value="${esc(state.query)}">`);
  }
  if (view.filters?.includes("status")) {
    const values = view.statusOptions || ["", "pending", "running", "done", "failed", "cancelled"];
    const options = values
      .map((s) => `<option value="${s}" ${s === state.status ? "selected" : ""}>${s || "любой статус"}</option>`);
    parts.push(`<select id="f-status">${options.join("")}</select>`);
  }
  if (state.view === "users") {
    parts.push(`<span class="count" id="u-counts"></span>` +
      `<input id="u-cap" type="number" min="0" placeholder="лимит активных" ` +
      `title="пусто = без лимита; 0 = приём закрыт, все новые в очередь">` +
      `<button class="act" id="u-cap-save">сохранить лимит</button>`);
  }
  if (state.view === "params") {
    parts.push(`<select id="p-user"><option value="">пользователь…</option></select>` +
      `<input id="p-code" placeholder="код: например timezone" pattern="[a-z0-9_]{1,64}">` +
      `<input id="p-value" placeholder="значение">` +
      `<button class="act" id="p-save">сохранить</button>`);
  }
  if (state.view === "tariffs") {
    parts.push(`<input id="t-code" placeholder="код" pattern="[a-z0-9_]{1,64}" size="8">` +
      `<input id="t-title" placeholder="название" size="12">` +
      `<input id="t-features" placeholder="функции через запятую" size="24">` +
      `<input id="t-tokens" type="number" placeholder="токены/д" size="8">` +
      `<input id="t-msgs" type="number" placeholder="сообщ./д" size="6">` +
      `<input id="t-answers" type="number" placeholder="ответы/д" size="6">` +
      `<input id="t-cron" type="number" placeholder="cron" size="4">` +
      `<input id="t-datasets" type="number" placeholder="датасеты" size="4">` +
      `<input id="t-memory" type="number" placeholder="память, симв." size="7">` +
      `<label class="mono" title="тариф пользователей без явного назначения"><input type="checkbox" id="t-default">дефолт</label>` +
      `<button class="act" id="t-save">сохранить</button>` +
      `<span class="count">назначают тариф в строке человека, вкладка «Пользователи»</span>`);
  }
  if (state.view === "usage") {
    parts.push(`<button class="act" data-nav="usageevents">журнал событий</button>`);
  }
  if (state.view === "usageevents") {
    parts.push(`<button class="act" data-nav="usage">← к сводке</button>`);
  }
  parts.push(`<span class="spacer"></span><span class="count" id="title">${esc(view.title)}</span>`);
  document.getElementById("toolbar").innerHTML = parts.join(" ");
  document.getElementById("f-query")?.addEventListener("change", (e) => {
    state.query = e.target.value; state.offset = 0; load();
  });
  document.getElementById("f-status")?.addEventListener("change", (e) => {
    state.status = e.target.value; state.offset = 0; load();
  });
  if (state.view === "users") setupUsersForm();
  if (state.view === "params") setupParamForm();
  if (state.view === "tariffs") setupTariffForm();
}

async function setupUsersForm() {
  try {
    const page = await api("/api/admin/users");
    const cap = page.max_active_users;
    document.getElementById("u-counts").textContent =
      `активных: ${page.active_count}${cap == null ? "" : " из " + cap} · ` +
      `в очереди: ${page.waiting_count} · забанено: ${page.banned_count}`;
    if (cap != null) document.getElementById("u-cap").value = cap;
  } catch (error) { fail(`не удалось получить счётчики: ${error.message}`); }
  document.getElementById("u-cap-save").addEventListener("click", async () => {
    const raw = document.getElementById("u-cap").value.trim();
    try {
      if (raw === "") {
        await api("/api/admin/settings/max_active_users", { method: "DELETE" });
      } else {
        await api("/api/admin/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: "max_active_users", value: raw }),
        });
      }
      await load();
    } catch (error) { fail(`сохранение не удалось: ${error.message}`); }
  });
}

async function setupParamForm() {
  const userSelect = document.getElementById("p-user");
  try {
    const { items } = await api("/api/admin/users");
    userSelect.innerHTML = `<option value="">пользователь…</option>` + items
      .map((u) => `<option value="${esc(u.user_id)}">${esc(u.name || u.user_id)}</option>`)
      .join("");
  } catch (error) { fail(`не удалось получить пользователей: ${error.message}`); }
  document.getElementById("p-save").addEventListener("click", async () => {
    const body = {
      user_id: userSelect.value,
      code: document.getElementById("p-code").value.trim(),
      value: document.getElementById("p-value").value.trim(),
    };
    if (!body.user_id || !body.code || !body.value) { fail("заполните пользователя, код и значение"); return; }
    try {
      await api("/api/admin/params", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      document.getElementById("p-code").value = "";
      document.getElementById("p-value").value = "";
      await load();
    } catch (error) { fail(`сохранение не удалось: ${error.message}`); }
  });
}

async function setupTariffForm() {
  try {
    const { features } = await api("/api/admin/tariffs");
    document.getElementById("t-features").title = `известные функции: ${features.join(", ")}`;
  } catch (error) { fail(`не удалось получить данные формы: ${error.message}`); }
  const num = (id) => {
    const raw = document.getElementById(id).value.trim();
    return raw === "" ? null : Number(raw);
  };
  document.getElementById("t-save").addEventListener("click", async () => {
    const body = {
      code: document.getElementById("t-code").value.trim(),
      title: document.getElementById("t-title").value.trim(),
      features: document.getElementById("t-features").value
        .split(",").map((f) => f.trim()).filter(Boolean),
      daily_tokens: num("t-tokens"),
      daily_user_messages: num("t-msgs"),
      daily_assistant_messages: num("t-answers"),
      max_cron_jobs: num("t-cron"),
      max_datasets: num("t-datasets"),
      max_memory_chars: num("t-memory"),
      is_default: document.getElementById("t-default").checked,
    };
    if (!body.code || !body.title) { fail("заполните код и название тарифа"); return; }
    try {
      await api("/api/admin/tariffs", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      await load();
    } catch (error) { fail(`сохранение не удалось: ${error.message}`); }
  });
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(`${response.status} ${await response.text()}`);
  return response.status === 204 ? null : response.json();
}

function fail(message) {
  const box = document.getElementById("error");
  box.hidden = false;
  box.textContent = message;
}

async function loadTotals() {
  const totals = await api("/api/admin/totals");
  document.getElementById("totals").textContent = Object.entries(totals)
    .map(([key, value]) => `${key}: ${value}`).join(" · ");
}

async function load() {
  const view = VIEWS[state.view];
  document.getElementById("error").hidden = true;
  renderNav();
  renderToolbar(view);
  const params = new URLSearchParams({ limit: state.limit, offset: state.offset });
  if (view.filters?.includes("query") && state.query) params.set("query", state.query);
  if (view.filters?.includes("status") && state.status) params.set("status", state.status);
  try {
    const page = await api(`${view.path()}?${params}`);
    view.absorb?.(page);  // что строка умеет показать, но не может запросить сама
    document.getElementById("head").innerHTML =
      `<tr>${view.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>`;
    document.getElementById("body").innerHTML = page.items.length
      ? page.items.map((item) => `<tr>${view.row(item)}</tr>`).join("")
      : `<tr><td colspan="${view.columns.length}" class="count">пусто</td></tr>`;
    const to = Math.min(page.offset + page.limit, page.total);
    document.getElementById("range").textContent = `${page.total ? page.offset + 1 : 0}–${to} из ${page.total}`;
    document.getElementById("prev").disabled = page.offset === 0;
    document.getElementById("next").disabled = to >= page.total;
  } catch (error) {
    fail(`не удалось загрузить: ${error.message}`);
  }
}

document.addEventListener("click", async (event) => {
  const target = event.target.closest("[data-nav],[data-open-dialog],[data-open-dataset],[data-view],[data-delete],[data-post]");
  if (!target) return;
  const data = target.dataset;
  if (data.nav) { state.view = data.nav; state.offset = 0; state.query = ""; state.status = ""; return load(); }
  if (data.openDialog) { state.dialogId = data.openDialog; state.view = "messages"; state.offset = 0; return load(); }
  if (data.openDataset) { state.datasetId = data.openDataset; state.view = "records"; state.offset = 0; return load(); }
  if (data.view !== undefined) return open(data.view || "(пусто)");
  if (data.delete && confirm("Удалить безвозвратно?")) {
    try { await api(data.delete, { method: "DELETE" }); await Promise.all([load(), loadTotals()]); }
    catch (error) { fail(`удаление не удалось: ${error.message}`); }
    return;
  }
  if (data.post) {
    if (data.confirm && !confirm(data.confirm)) return;
    try { await api(data.post, { method: "POST" }); await load(); }
    catch (error) { fail(`действие не удалось: ${error.message}`); }
  }
});

document.addEventListener("change", async (event) => {
  const select = event.target.closest("select[data-assign]");
  if (!select) return;
  try {
    await api("/api/admin/tariffs/assign", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: select.dataset.assign, code: select.value || null }),
    });
    await load();
  } catch (error) { fail(`назначение не удалось: ${error.message}`); await load(); }
});

document.getElementById("prev").addEventListener("click", () => {
  state.offset = Math.max(0, state.offset - state.limit); load();
});
document.getElementById("next").addEventListener("click", () => {
  state.offset += state.limit; load();
});
document.getElementById("viewer-close").addEventListener("click", () => {
  document.getElementById("viewer").close();
});

loadTotals().catch((error) => fail(`не удалось получить сводку: ${error.message}`));
load();
</script>
</body>
</html>
