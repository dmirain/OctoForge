[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoforge-web"
version = "0.1.0"
description = "OctoForge web wrapper (FastAPI)"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
dependencies = [
    # web is the reference deployment; keep local embeddings/reranker working
    # out of the box. Building against a leaner octoforge-core (OpenAI-compatible
    # embeddings only, no torch) is exactly why core makes the extra optional.
    "octoforge-core[local-embeddings]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octoforge_web = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["octoforge_web"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
