[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoforge-server"
version = "0.11.1"
description = "OctoForge HTTP service over the core library"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
dependencies = [
    # the reference deployment keeps local embeddings and Postgres working out
    # of the box; a leaner build drops both extras (see core's pyproject)
    "octoforge-core[local-embeddings,postgres]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # keep in sync with core's dev extra (see the note there)
    "ruff>=0.16,<0.17",
    "pylint>=4,<5",
    "mypy>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octoforge_server = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "N", "SIM", "RET", "ANN", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 3
max-statements = 20
