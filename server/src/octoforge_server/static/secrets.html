<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OctoForge — секреты</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .hint { color: #777; font-size: .85rem; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #8884; }
  form { display: grid; gap: .5rem; margin-top: 1rem; }
  input { padding: .5rem; font: inherit; border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; }
  button { padding: .5rem .9rem; font: inherit; border: 1px solid #8886; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  #status { min-height: 1.4em; }
  .ok { color: #16a34a; } .err { color: #dc2626; }
</style>
</head>
<body>
<h1>Секреты для внешних API</h1>
<p class="hint">Значения шифруются и никогда не показываются ни вам, ни ассистенту —
он знает только код секрета. Секрет отправляется только на указанный хост.
Ссылка одноразовая и действует 10 минут.</p>

<div id="app" hidden>
  <table id="list" hidden>
    <thead><tr><th>Код</th><th>Хост</th><th>Использован</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
  <form id="add">
    <input name="code" placeholder="код: например mail_token" required
           pattern="[a-z0-9_]{1,64}" title="строчные латинские буквы, цифры и _">
    <input name="value" type="password" placeholder="значение (токен/ключ)" required autocomplete="off">
    <input name="allowed_host" placeholder="хост: например api.mail.example.com" required>
    <button class="primary" type="submit">Сохранить</button>
  </form>
</div>
<p id="status"></p>

<script>
// the token lives in the fragment so it never reaches a server log; strip it
// from the address bar once read, so a shared screen or history does not keep it
const token = new URLSearchParams(location.hash.slice(1)).get("token") || "";
if (token) history.replaceState(null, "", location.pathname);
const statusEl = document.getElementById("status");
const appEl = document.getElementById("app");

function say(text, ok) {
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "err";
}

async function api(path, body) {
  const options = body === undefined
    ? {}
    : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const response = await fetch(path, options);
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.detail || response.statusText);
  return payload;
}

async function refresh() {
  const { secrets } = await api("/api/secrets/session", { token });
  const table = document.getElementById("list");
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  table.hidden = secrets.length === 0;
  for (const item of secrets) {
    const row = tbody.insertRow();
    row.insertCell().textContent = item.code;
    row.insertCell().textContent = item.allowed_host;
    row.insertCell().textContent = item.last_used_at ? item.last_used_at.slice(0, 16).replace("T", " ") : "—";
    const del = document.createElement("button");
    del.textContent = "удалить";
    del.onclick = async () => {
      if (!confirm(`Удалить секрет «${item.code}»?`)) return;
      try { await api("/api/secrets/delete", { token, code: item.code }); await refresh(); say("Удалено.", true); }
      catch (error) { say(error.message, false); }
    };
    row.insertCell().appendChild(del);
  }
}

document.getElementById("add").addEventListener("submit", async (event) => {
  event.preventDefault();
  const form = event.target;
  try {
    await api("/api/secrets/set", {
      token,
      code: form.code.value.trim(),
      value: form.value.value,
      allowed_host: form.allowed_host.value.trim(),
    });
    form.reset();
    await refresh();
    say("Сохранено. Значение больше нигде не отображается.", true);
  } catch (error) { say(error.message, false); }
});

(async () => {
  if (!token) { say("Нет токена: откройте ссылку из Telegram (/secrets).", false); return; }
  try { await refresh(); appEl.hidden = false; }
  catch (error) { say(error.message, false); }
})();
</script>
</body>
</html>
