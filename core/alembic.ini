# Alembic config for the OctoForge schema.
#
# Runtime migrations run programmatically from the composition root (the async
# engine's connection is injected), so this file mainly serves the CLI:
#   cd core && ../.venv/bin/alembic revision --autogenerate -m "..."
#   cd core && ../.venv/bin/alembic upgrade head
# The URL below is a sync driver used only by the CLI; startup overrides it.
[alembic]
script_location = src/octoforge_core/db/migrations
prepend_sys_path = src
sqlalchemy.url = sqlite:///./octoforge.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
