[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoforge-core"
version = "0.1.0"
description = "OctoForge agent core library"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2",
    "aiosqlite>=0.19",
    "croniter>=6,<7",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octoforge_core = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["octoforge_core"]

# croniter ships no py.typed marker (as of the 6.x line); imports are untyped
# and all call results are bound to annotated variables at the call sites.
[[tool.mypy.overrides]]
module = ["croniter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
