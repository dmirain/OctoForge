[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "octoforge-core"
version = "0.6.1"
description = "OctoForge agent core library"
license = { text = "BUSL-1.1" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "cryptography>=42",
    "sqlalchemy[asyncio]>=2",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "croniter>=6,<7",
]

[project.optional-dependencies]
# sentence-transformers pulls in torch (and, via its default PyPI wheel, a
# pile of CUDA packages) -- only worth the download if you actually want the
# local embeddings/reranker backends (OF_EMBEDDING_BACKEND=local). Without
# this extra, octoforge-core still works fully with the OpenAI-compatible
# embeddings/reranker HTTP backends.
local-embeddings = [
    "sentence-transformers>=3",
]
# The async Postgres driver. Not a hard dependency: aiosqlite covers the
# embedded case, and a library consumer that never points OF_DATABASE_URL at
# postgresql+asyncpg:// has no reason to install it.
postgres = [
    "asyncpg>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # Both checkers are capped: their releases change verdicts on unchanged
    # code (a ruff minor stabilizes preview rules — PLR0917 in 0.16 — and
    # flips both lint errors and `noqa` usefulness; a mypy major changes
    # inference), so an unbounded range makes CI and a local .venv disagree.
    # Bump deliberately, with the fallout in the same change.
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
octoforge_core = [
    "py.typed",
    "db/migrations/*.py",
    "db/migrations/*.mako",
    "db/migrations/versions/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic migration scripts use the dynamic `op`/`sa` API and generated
# boilerplate; they are not held to the library's lint/type standards.
extend-exclude = ["src/octoforge_core/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "C90", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["octoforge_core"]
# Alembic migration scripts are excluded from strict typing (dynamic op API).
exclude = ["src/octoforge_core/db/migrations/"]

# croniter ships no py.typed marker (as of the 6.x line); imports are untyped
# and all call results are bound to annotated variables at the call sites.
[[tool.mypy.overrides]]
module = ["croniter"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# test-time budget is enforced, not aspirational: every run prints what is
# slow (>=0.5s), and a test stuck past 90s dumps stacks instead of hanging
# the gate silently (faulthandler is stdlib, no plugin dependency)
addopts = "--durations=15 --durations-min=0.5"
faulthandler_timeout = 90
