# Default `docker compose up -d`: Postgres, the app (HTTP API + operator console
# + the Telegram bot in one process) and Caddy terminating TLS for SITE_DOMAIN.
#
# One process serves both surfaces on purpose. Splitting web and telegram across
# two containers would put two cron schedulers and two recovery sweeps on one
# database, and neither filters by channel — a Telegram user's firing could be
# executed by the web process, whose runner has no bridge to deliver it. The
# telegram-only service stays available under the `standalone` profile for a
# deployment that runs no HTTP surface at all.
x-app-build: &app-build
  context: .
  args:
    # CPU-only by default. For a CUDA build set e.g.
    # TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124 (and add GPU
    # passthrough via deploy.resources.reservations.devices, which needs the
    # NVIDIA Container Toolkit on the host).
    TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

# Reach Postgres over the compose network. These override whatever the URLs are
# in .env, where a host-side SQLite path would silently create a throwaway file
# inside the container.
x-app-databases: &app-databases
  OF_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-octoforge}:${POSTGRES_PASSWORD:-octoforge}@postgres:5432/${POSTGRES_DB:-octoforge}
  OF_TELEGRAM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-octoforge}:${POSTGRES_PASSWORD:-octoforge}@postgres:5432/${POSTGRES_TELEGRAM_DB:-octoforge_telegram}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-octoforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-octoforge}
      POSTGRES_DB: ${POSTGRES_DB:-octoforge}
      POSTGRES_TELEGRAM_DB: ${POSTGRES_TELEGRAM_DB:-octoforge_telegram}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-octoforge_test}
      POSTGRES_DEV_DB: ${POSTGRES_DEV_DB:-octoforge_dev}
    ports:
      # loopback only: psql/pg_dump from the host without exposing the server
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 18+ stores the cluster in a major-version subdirectory (/var/lib/postgresql/18/docker)
      # and refuses to start with a mount on the old /var/lib/postgresql/data path,
      # so the volume goes one level up — this also keeps `pg_upgrade --link`
      # possible later. See docker-library/postgres#1259.
      - pg-data:/var/lib/postgresql
      # runs once per volume: creates the invite, test and dev databases
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-octoforge} -d ${POSTGRES_DB:-octoforge}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build: *app-build
    image: octoforge:local
    env_file:
      - .env
    environment: *app-databases
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # the host's model cache: without it the container re-downloads the
      # 1.1 GB embedding model on first start
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      # system-skill overlay (OF_SYSTEM_SKILLS_SOURCE): scenario tuning for this
      # installation — edit the file and restart, no rebuild
      - ./docker/system_skills.ru.json:/etc/octoforge/system_skills.json:ro
    # No published port: Caddy reaches it over the compose network, so the app
    # never answers without TLS.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # point ACME_CA at https://acme-staging-v02.api.letsencrypt.org/directory
      # while checking that inbound :80 works — staging has loose rate limits
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates and the ACME account: losing this volume means re-issuing
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  telegram:
    profiles: ["standalone"]
    build: *app-build
    image: octoforge:local
    command: ["python", "-m", "octoforge_web.telegram"]
    env_file:
      - .env
    environment: *app-databases
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    # No ports and no healthcheck on purpose: this surface only makes outbound
    # connections (Bot API long poll, LLM, embeddings) and exposes no endpoint
    # to probe. Liveness is left to `restart`.
    restart: unless-stopped

volumes:
  pg-data:
  caddy-data:
  caddy-config:
